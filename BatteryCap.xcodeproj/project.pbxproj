		BC0000000000000000000049 /* Generate Daemon Plist */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchServices/batterycapd",
			);
			name = "Generate Daemon Plist";
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(BC_APP_ID).daemon.plist",
			);
			shellPath = /bin/sh;
			shellScript = (
				"set -euo pipefail",
				"# Generates the SMAppService launchd plist from build settings, so its Label,",
				"# Mach service and associated bundle identifier can never drift from the",
				"# bundle identifiers (a mismatch leaves the daemon unreachable).",
				"DAEMON_ID=\"${BC_APP_ID}.daemon\"",
				"CONTENTS=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}\"",
				"DEST=\"${CONTENTS}/Library/LaunchDaemons\"",
				"PLIST=\"${DEST}/${DAEMON_ID}.plist\"",
				"PB=/usr/libexec/PlistBuddy",
				"",
				"# The script sandbox only permits touching the declared output, so remove just",
				"# that (PlistBuddy would otherwise add to the old file). A plist left by a",
				"# previous BC_APP_ID needs a Clean Build Folder.",
				"rm -f \"${PLIST}\"",
				"mkdir -p \"${DEST}\"",
				"$PB -c \"Add :Label string ${DAEMON_ID}\" \\",
				"    -c \"Add :BundleProgram string Contents/Library/LaunchServices/batterycapd\" \\",
				"    -c \"Add :AssociatedBundleIdentifiers array\" \\",
				"    -c \"Add :AssociatedBundleIdentifiers:0 string ${BC_APP_ID}\" \\",
				"    -c \"Add :MachServices dict\" \\",
				"    -c \"Add :MachServices:${DAEMON_ID} bool true\" \\",
				"    -c \"Add :RunAtLoad bool true\" \\",
				"    -c \"Add :KeepAlive dict\" \\",
				"    -c \"Add :KeepAlive:SuccessfulExit bool false\" \\",
				"    -c \"Add :ProcessType string Adaptive\" \\",
				"    -c \"Add :EnableTransactions bool false\" \\",
				"    \"${PLIST}\" >/dev/null",
				"echo \"Generated ${PLIST}\"",
				"",
				"# Build-time integrity check: the embedded daemon must carry the identifier",
				"# the plist and the app expect.",
				"if [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"YES\" ]; then",
				"    DAEMON_BIN=\"${CONTENTS}/Library/LaunchServices/batterycapd\"",
				"    ACTUAL_ID=$(codesign -dv \"${DAEMON_BIN}\" 2>&1 | sed -n 's/^Identifier=//p')",
				"    if [ \"${ACTUAL_ID}\" != \"${DAEMON_ID}\" ]; then",
				"        echo \"error: embedded daemon is signed as '${ACTUAL_ID}', expected '${DAEMON_ID}'\"",
				"        exit 1",
				"    fi",
				"fi",
				"",
			);
		};
